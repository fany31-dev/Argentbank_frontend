swagger: "2.0"
info:
  title: Bank Argent API documentation
  description: Contains all available API endpoints in this codebase
  version: "1.0.0"
  termsOfService: "http://swagger.io/terms/"
host: localhost:3001
basePath: /api/v1
schemes:
  - http
paths:
  /user/login:
    post:
      tags:
        - User Module
      summary: Login
      description: API for Login
      parameters:
        - in: body
          name: body
          description: Login Payload
          required: true
          schema:
            $ref: "#/definitions/Login"
      produces:
        - application/json
      responses:
        "200":
          description: Login Successfully
          schema:
            $ref: "#/definitions/LoginResponse"
        "400":
          description: Invalid Fields
        "500":
          description: Internal Server Error
  /user/signup:
    post:
      tags:
        - User Module
      summary: Signup
      description: API for Signup
      parameters:
        - in: body
          name: body
          description: Signup Payload
          required: true
          schema:
            $ref: "#/definitions/User"
      produces:
        - application/json
      responses:
        "200":
          description: Signup Successfully
          schema:
            $ref: "#/definitions/ApiResponse"
        "400":
          description: Invalid Fields
        "500":
          description: Internal Server Error
  /user/profile:
    get:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for fetching a user profile
      produces:
        - application/json
      responses:
        "200":
          description: User profile retrieved successully
          schema:
            $ref: "#/definitions/ApiResponse"
        "400":
          description: Invalid Fields
        "500":
          description: Internal Server Error
    put:
      security:
        - Bearer: []
      tags:
        - User Module
      summary: User Profile API
      description: API for updating a user profile
      parameters:
        - in: body
          name: body
          description: Update user profile attributes
          required: true
          schema:
            $ref: "#/definitions/UserProfile"
      produces:
        - application/json
      responses:
        "200":
          description: User profile retrieved successully
          schema:
            $ref: "#/definitions/ApiResponse"
        "400":
          description: Invalid Fields
        "500":
          description: Internal Server Error
  /accounts:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Get a list of user accounts
      description: API for Returns all accounts belonging to the authenticated user

      produces:
        - application/json

      responses:
        "200":
          description: Accounts successfully retrieved
          schema:
            $ref: "#/definitions/Accounts"
        "400":
          description: Invalid Fields
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
  /accounts/{accountId}/transactions:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Get a list of transactions for account
      description: API for fetching all transactions for a specific account. Transactions can be filtered by month.
      parameters:
        - in: path
          name: accountId
          type: string
          description: Account ID
          required: true

        - in: query
          name: month
          type: string
          description: Filter transactions by month (YYYY-MM)
          required: false

      produces:
        - application/json

      responses:
        "200":
          description: Transactions successfully retrieved
          schema:
            $ref: "#/definitions/Transactions"
        "400":
          description: Invalid Fields
        "401":
          description: Unauthorized
        "404":
          description: Returns an error - Account not found
        "500":
          description: Internal Server Error
  /transactions/{transactionId}:
    get:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Get transaction elements
      description: API for fetching elements of a specific transaction

      parameters:
        - in: path
          name: transactionId
          description: Transaction ID
          required: true
          type: string

      produces:
        - application/json

      responses:
        "200":
          description: Transaction elements retrieved successfully
          schema:
            $ref: "#/definitions/TransactionElements"
        "400":
          description: Invalid Fields
        "401":
          description: Unauthorized
        "404":
          description: Transaction not found
        "500":
          description: Internal Server Error

    patch:
      security:
        - Bearer: []
      tags:
        - Transactions Module
      summary: Update transaction elements
      description: API for updating a transaction category and/or note

      parameters:
        - in: path
          name: transactionId
          description: Transaction ID
          required: true
          type: string

        - in: body
          name: body
          description: Transaction information to update
          required: true
          schema:
            $ref: "#/definitions/TransactionElementsUpdate"

      produces:
        - application/json

      responses:
        "200":
          description: Transaction elements updated successfully
          schema:
            $ref: "#/definitions/TransactionElements"
        "400":
          description: Invalid Fields
        "401":
          description: Unauthorized
        "404":
          description: Transaction not found
        "500":
          description: Internal Server Error

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header

definitions:
  User:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
      firstName:
        type: string
        description: user first name
      lastName:
        type: string
        description: user last name
      userName:
        type: string
        description: user public name
  Login:
    properties:
      email:
        type: string
        description: user email
      password:
        type: string
        description: user password
  ApiResponse:
    type: object
    properties:
      status:
        type: integer
      message:
        type: string
      body:
        type: object
        properties:
          id:
            type: string
          email:
            type: string
  LoginResponse:
    type: object
    properties:
      token:
        type: string
  UserProfile:
    type: object
    properties:
      userName:
        type: string
  Accounts:
    type: object
    properties:
      status:
        type: integer
        description: Status code
      message:
        type: string
        description: Response message
      body:
        type: array
        items:
          type: object
          properties:
            accountId:
              type: string
              description: Account ID
            title:
              type: string
              description: Account title
            accountBalance:
              type: number
              description: Account balance
            etatBalance:
              type: string
              description: Balance status
  Transactions:
    type: object
    properties:
      status:
        type: integer
        description: Status code
      message:
        type: string
        description: Response message
      body:
        type: array
        items:
          type: object
          properties:
            transactionId:
              type: string
              description: Transaction ID
            date:
              type: string
              format: date
              description: Transaction date
            description:
              type: string
              description: Transaction description
            amount:
              type: number
              description: Transaction amount
            balanceValue:
              type: number
              description: Account balance
  TransactionElements:
    type: object
    properties:
      status:
        type: integer
        description: Status code
      message:
        type: string
        description: Response message
      body:
        type: array
        items:
          type: object
          properties:
            transactionId:
              type: string
              description: Transaction ID
            date:
              type: string
              format: date
              description: Transaction date
            description:
              type: string
              description: Transaction description
            amount:
              type: number
              description: Transaction amount
            balanceValue:
              type: number
              description: Account balance
            transactionType:
              type: string
              description: Type of transaction
            category:
              type: string
              description: Transaction category
            note:
              type: string
              description: User note
  TransactionElementsUpdate:
    type: object
    properties:
      category:
        type: string
        description: Transaction category
      note:
        type: string
        x-nullable: true
        description: User note - set to null to delete
